<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carrito · Betina Di Luzio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
.cart-page { padding: 140px var(--s-7) 100px; max-width: 1280px; margin: 0 auto; }
.cart-page h1 { font-size: var(--t-h1); margin-bottom: 48px; }
.cart-page h1 em { font-style: italic; color: var(--accent-deep);}
.cart-grid { display: grid; grid-template-columns: 1fr 380px; gap: 48px; }
.cart-items { border-top: 1px solid var(--line); }
.cart-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 24px; padding: 28px 0; border-bottom: 1px solid var(--line); align-items: center;}
.cart-row .img { aspect-ratio: 3/4; height: 140px; position: relative; overflow: hidden;}
.cart-row .img .placeholder-img { position: absolute; inset: 0;}
.cart-row h3 { font-family: var(--serif); font-size: 22px; margin-bottom: 6px;}
.cart-row .opts { display: flex; gap: 16px; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 12px;}
.cart-row .opts .swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; vertical-align: middle; margin-right: 6px; border: 1px solid rgba(0,0,0,0.1);}
.cart-row .row-bot { display: flex; gap: 24px; align-items: center;}
.cart-row .qty-ctrl { display: flex; border: 1px solid var(--line); border-radius: 4px;}
.cart-row .qty-ctrl button { width: 32px; height: 36px;}
.cart-row .qty-ctrl span { width: 36px; text-align: center; font-family: var(--mono); line-height: 36px;}
.cart-row .remove { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.12em; transition: color 0.2s;}
.cart-row .remove:hover { color: var(--accent); text-decoration: underline;}
.cart-row .price-col { text-align: right;}
.cart-row .price-col .price { font-family: var(--mono); font-size: 16px;}

.summary { background: var(--bg-warm); padding: 32px; border-radius: 4px; align-self: start; position: sticky; top: 110px;}
.summary h3 { font-family: var(--serif); font-size: 28px; margin-bottom: 24px;}
.summary-row { display: flex; justify-content: space-between; padding: 12px 0; font-family: var(--mono); font-size: 13px;}
.summary-row.total { font-family: var(--serif); font-size: 24px; padding-top: 24px; border-top: 1px solid var(--line); margin-top: 12px;}
.summary .promo { display: flex; gap: 8px; margin: 24px 0;}
.summary .promo input { flex: 1; padding: 12px; border: 1px solid var(--line); border-radius: 4px; font-family: var(--mono); font-size: 12px;}
.summary .promo button { padding: 12px 16px; background: var(--ink); color: var(--bg); border-radius: 4px; font-family: var(--mono); font-size: 11px; text-transform: uppercase;}
.summary .checkout { width: 100%; padding: 18px; background: #25D366; color: white; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.18em; margin-top: 24px;}
.summary .checkout:hover { background: #1FB959; }
.summary .checkout svg { width: 16px; height: 16px; fill: currentColor;}
.summary .secondary-link { text-align: center; display: block; margin-top: 16px; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-soft);}
.summary .secondary-link:hover { color: var(--accent-deep);}

.empty-cart { text-align: center; padding: 80px 20px; }
.empty-cart h2 { font-family: var(--serif); font-size: 48px; margin-bottom: 16px;}
.empty-cart p { color: var(--ink-soft); margin-bottom: 32px; font-family: var(--serif); font-style: italic; font-size: 20px;}

@media (max-width: 900px) { .cart-grid { grid-template-columns: 1fr;} .summary { position: static;} }
</style>
</head>
<body>
<div data-include="nav"></div>

<main class="cart-page">
  <h1 class="serif">Tu <em>carrito</em>.</h1>
  <div id="cart-content"></div>
</main>

<div data-include="footer"></div>

<script src="assets/data.js"></script>
<script src="assets/shared.js"></script>
<script src="assets/layout.js"></script>
<script>
window.BDLLayout.mount('tienda');

function render() {
  const items = window.BDLCart.items();
  const root = document.getElementById('cart-content');
  if (!items.length) {
    root.innerHTML = `
      <div class="empty-cart">
        <h2 class="serif">Tu carrito está vacío.</h2>
        <p>Pero hay tantas cosas lindas esperándote...</p>
        <a href="tienda.html" class="btn btn-primary">Explorar la tienda</a>
      </div>`;
    return;
  }
  const colorNames = { '#CB674C': 'Terracota', '#36160E': 'Tinta', '#FCF5F4': 'Crema', '#6C95B0': 'Azul polvo', '#595421': 'Olivo', '#DBD7D3': 'Crudo', '#1E2D37': 'Noche', '#984C37': 'Cobre', '#653022': 'Borgoña', '#EEC5BA': 'Rosa', '#CCDEEA': 'Cielo', '#B7B0A9': 'Piedra', '#4D4A47': 'Carbón'};
  const subtotal = window.BDLCart.total();
  root.innerHTML = `
    <div class="cart-grid">
      <div class="cart-items">
        ${items.map(it => `
          <div class="cart-row">
            <div class="img"><div class="placeholder-img"><div class="placeholder-label" style="font-size:9px;">${(it.placeholder||'').slice(0,30)}</div></div></div>
            <div>
              <h3>${it.name}</h3>
              <div class="opts">
                ${it.color ? `<span><span class="swatch" style="background:${it.color}"></span>${colorNames[it.color]||it.color}</span>` : ''}
                ${it.size ? `<span>Talle ${it.size}</span>` : ''}
              </div>
              <div class="row-bot">
                <div class="qty-ctrl">
                  <button onclick="window.BDLCart.setQty('${it.key}', ${it.qty-1}); render();">−</button>
                  <span>${it.qty}</span>
                  <button onclick="window.BDLCart.setQty('${it.key}', ${it.qty+1}); render();">+</button>
                </div>
                <button class="remove" onclick="window.BDLCart.remove('${it.key}'); render();">Quitar</button>
              </div>
            </div>
            <div class="price-col"><span class="price">${fmtARS(it.price * it.qty)}</span></div>
          </div>
        `).join('')}
      </div>
      <aside class="summary">
        <h3>Resumen</h3>
        <div class="summary-row"><span>Subtotal</span><span>${fmtARS(subtotal)}</span></div>
        <div class="summary-row"><span>Envío</span><span style="color:var(--ink-soft)">A coordinar</span></div>
        <div class="promo">
          <input type="text" placeholder="Código de descuento" />
          <button>Aplicar</button>
        </div>
        <div class="summary-row total"><span>Total</span><span>${fmtARS(subtotal)}</span></div>
        <a href="${buildWaUrl(items, subtotal)}" target="_blank" class="checkout">
          <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163a11.867 11.867 0 0 1-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 0 1 8.413 3.488 11.824 11.824 0 0 1 3.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 0 1-5.688-1.448L.057 24z"/></svg>
          Coordinar por WhatsApp
        </a>
        <a href="tienda.html" class="secondary-link">← Seguir comprando</a>
      </aside>
    </div>
  `;
}
function buildWaUrl(items, subtotal) {
  const colorNames = { '#CB674C': 'Terracota', '#36160E': 'Tinta', '#FCF5F4': 'Crema', '#6C95B0': 'Azul polvo', '#595421': 'Olivo', '#DBD7D3': 'Crudo'};
  let msg = 'Hola Betina! Quería coordinar este pedido:\n\n';
  items.forEach(i => {
    msg += `• ${i.name} — Talle ${i.size}, ${colorNames[i.color]||i.color} (x${i.qty}) → ${fmtARS(i.price*i.qty)}\n`;
  });
  msg += `\nTotal: ${fmtARS(subtotal)}\n¿Coordinamos pago y envío?`;
  return `https://wa.me/5493413003417?text=${encodeURIComponent(msg)}`;
}
window.render = render;
render();
</script>
</body>
</html>
