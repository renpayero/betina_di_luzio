<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Categorías · Admin Betina Di Luzio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>
<div class="admin-shell">
  <div data-include="admin-side"></div>
  <main class="admin-main">
    <div data-include="admin-header"></div>
    <div class="toolbar">
      <input type="search" placeholder="Buscar categoría..." />
      <button class="btn-add" onclick="document.getElementById('cmodal').classList.add('show')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Nueva categoría
      </button>
    </div>
    <div class="panel" style="padding: 0;">
      <table class="table">
        <thead><tr><th>Orden</th><th>Categoría</th><th>Slug</th><th>Productos</th><th>Visibilidad</th><th></th></tr></thead>
        <tbody id="catrows"></tbody>
      </table>
    </div>
  </main>
</div>
<div class="modal-bg" id="cmodal">
  <div class="modal">
    <h3 class="serif">Nueva categoría</h3>
    <div class="field"><label>Nombre</label><input type="text" placeholder="Sweaters" /></div>
    <div class="field"><label>Slug</label><input type="text" placeholder="sweaters" /></div>
    <div class="field"><label>Descripción corta</label><input type="text" placeholder="Calidez tejida para cada estación." /></div>
    <div class="field"><label>Imagen de portada</label>
      <div style="border: 2px dashed var(--line); border-radius: 8px; padding: 24px; text-align: center; color: var(--ink-soft); cursor: pointer;">
        <div style="font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em;">Subí imagen 4:5</div>
      </div>
    </div>
    <div class="modal-actions">
      <button onclick="document.getElementById('cmodal').classList.remove('show')" style="padding: 10px 18px; border: 1px solid var(--line); border-radius: 4px; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em;">Cancelar</button>
      <button class="btn-add" onclick="document.getElementById('cmodal').classList.remove('show')">Crear</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/admin-layout.js"></script>
<script>
window.BDLAdmin.mount('cat', 'Categorías', 'Organizá la tienda como vos querés.');
document.getElementById('catrows').innerHTML = window.BDL_CATEGORIES.map((c, i) => `
  <tr>
    <td><span style="font-family:var(--mono); cursor: grab; color:var(--ink-soft);">⋮⋮ ${String(i+1).padStart(2,'0')}</span></td>
    <td><strong style="font-family:var(--serif); font-size: 18px;">${c.name}</strong><br/><span style="color:var(--ink-soft); font-size:13px;">${c.blurb}</span></td>
    <td><span style="font-family:var(--mono); font-size: 12px;">/${c.slug}</span></td>
    <td><span class="tag green">${c.count} prod.</span></td>
    <td><span class="tag green">Visible</span></td>
    <td>
      <div style="display: flex; gap: 4px;">
        <button class="icon-action"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
        <button class="icon-action" style="color: var(--accent-deep);"><svg viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
      </div>
    </td>
  </tr>
`).join('');
</script>
</body>
</html>
