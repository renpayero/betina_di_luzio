<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Productos · Admin Betina Di Luzio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>
<div class="admin-shell">
  <div data-include="admin-side"></div>
  <main class="admin-main">
    <div data-include="admin-header"></div>

    <div class="tabs">
      <button class="active">Todos · <span id="tot">0</span></button>
      <button>Activos</button>
      <button>Borradores</button>
      <button>Sin stock</button>
      <button>En oferta</button>
    </div>

    <div class="toolbar">
      <input type="search" placeholder="Buscar por nombre, SKU, categoría..." id="search" />
      <div style="display: flex; gap: 8px;">
        <select style="padding: 10px 14px; font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 4px; background: white;">
          <option>Todas las categorías</option>
          <option>Sweaters</option><option>Cardigans</option><option>Mantas</option><option>Accesorios</option><option>Bebés</option><option>Living</option>
        </select>
        <button class="btn-add" onclick="document.getElementById('modal').classList.add('show')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Nuevo producto
        </button>
      </div>
    </div>

    <div class="panel" style="padding: 0;">
      <table class="table">
        <thead><tr><th><input type="checkbox" /></th><th>Producto</th><th>SKU</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Vistas</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Modal nuevo producto -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 class="serif">Nuevo producto</h3>
    <div class="field-row">
      <div class="field"><label>Nombre</label><input type="text" placeholder="Sweater Otoño..." /></div>
      <div class="field"><label>SKU</label><input type="text" placeholder="SW-013" /></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Categoría</label><select><option>Sweaters</option><option>Cardigans</option><option>Mantas</option><option>Accesorios</option><option>Bebés</option><option>Living</option></select></div>
      <div class="field"><label>Precio (ARS)</label><input type="number" placeholder="89000" /></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Stock</label><input type="number" placeholder="3" /></div>
      <div class="field"><label>Estado</label><select><option>Activo</option><option>Borrador</option><option>Archivado</option></select></div>
    </div>
    <div class="field"><label>Descripción</label><textarea placeholder="Sweater de punto trenzado..." style="font-family: inherit; padding: 14px; border: 1px solid var(--line); border-radius: 4px; min-height: 100px;"></textarea></div>
    <div class="field-row">
      <div class="field"><label>Talles disponibles</label><input type="text" placeholder="S, M, L" /></div>
      <div class="field"><label>Colores (hex)</label><input type="text" placeholder="#CB674C, #36160E" /></div>
    </div>
    <div class="field"><label>Galería de fotos</label>
      <div style="border: 2px dashed var(--line); border-radius: 8px; padding: 32px; text-align: center; color: var(--ink-soft); cursor: pointer;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 8px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
        <div style="font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em;">Arrastrá fotos · o hacé clic</div>
        <div style="font-size: 12px; margin-top: 6px;">JPG, PNG · hasta 4MB · galería múltiple</div>
      </div>
    </div>
    <div class="modal-actions">
      <button onclick="document.getElementById('modal').classList.remove('show')" style="padding: 10px 18px; border: 1px solid var(--line); border-radius: 4px; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em;">Cancelar</button>
      <button class="btn-add" onclick="document.getElementById('modal').classList.remove('show')">Crear producto</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/admin-layout.js"></script>
<script>
window.BDLAdmin.mount('prod', 'Productos', 'Gestioná tu catálogo, stock y variantes.');
const catName = id => window.BDL_CATEGORIES.find(c => c.id === id)?.name || '—';
const skuFor = (p, i) => p.cat.slice(0,2).toUpperCase() + '-' + String(i+1).padStart(3,'0');
const rows = document.getElementById('rows');
const all = window.BDL_PRODUCTS;
document.getElementById('tot').textContent = all.length;
function render(list) {
  rows.innerHTML = list.map((p, i) => `
    <tr>
      <td><input type="checkbox" /></td>
      <td><div class="product-cell">
        <div class="img" style="background: linear-gradient(135deg, ${p.colors[0]}, ${p.colors[p.colors.length-1]});"></div>
        <div><strong>${p.name}</strong><br/><span style="font-family:var(--mono); font-size:11px; color:var(--ink-soft);">${p.placeholder}</span></div>
      </div></td>
      <td><span style="font-family:var(--mono); font-size:12px;">${skuFor(p, i)}</span></td>
      <td>${catName(p.cat)}</td>
      <td><span style="font-family:var(--mono);">$${p.price.toLocaleString('es-AR')}</span></td>
      <td><span class="tag ${p.stock < 3 ? 'red' : p.stock < 5 ? 'amber' : 'green'}">${p.stock} u.</span></td>
      <td>${p.status ? `<span class="tag ${p.status==='sale'?'amber':'green'}">${p.status==='new'?'Nuevo':p.status==='sale'?'Oferta':'Best'}</span>` : '<span class="tag gray">Activo</span>'}</td>
      <td><span style="font-family:var(--mono); color: var(--ink-soft);">${(Math.random()*900+200|0)}</span></td>
      <td>
        <div style="display: flex; gap: 4px;">
          <button class="icon-action" title="Editar"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
          <button class="icon-action" title="Duplicar"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
          <button class="icon-action" title="Eliminar" style="color: var(--accent-deep);"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
        </div>
      </td>
    </tr>
  `).join('');
}
render(all);
document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  render(all.filter(p => p.name.toLowerCase().includes(q) || catName(p.cat).toLowerCase().includes(q)));
});
</script>
</body>
</html>
