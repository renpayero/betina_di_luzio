name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: betina
          POSTGRES_USER: betina
          POSTGRES_PASSWORD: betina_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U betina -d betina"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://betina:betina_dev@localhost:5432/betina
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx drizzle-kit push --force
      - run: npx tsx src/db/seed.ts
      - run: npm test
